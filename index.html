<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイピングコンテスト用</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Language Switch Button (Goes to the English game) -->
  <div style="position: absolute; top: 15px; right: 15px; z-index: 1000;">
    <a href="english-game/index.html" style="padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-family: sans-serif; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">ENG</a>
  </div>

  <div id="game">
    <h1>辰巳中タイピング</h1>

    <div id="word-box">
      <div id="kanji">スタート</div>
      <div id="kana">すたーと</div>
      <div id="romaji-guide"></div>
    </div>

    <input
      type="text"
      id="input"
      placeholder="STARTを押してタイピング開始"
      autocomplete="off"
      disabled
    >

    <div id="status">
      <div id="score">スコア: 0</div>
      <div id="time">残り時間: 60</div>
    </div>

    <button id="start">START</button>

    <div id="game-over"></div>
  </div>

  <!-- 効果音 -->
  <audio id="se-correct" src="sounds/correct.mp3" preload="auto"></audio>
  <audio id="se-miss" src="sounds/miss.mp3" preload="auto"></audio>
  <audio id="se-start" src="sounds/start.mp3" preload="auto"></audio>
  <audio id="se-end" src="sounds/end.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
