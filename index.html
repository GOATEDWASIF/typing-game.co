<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイピングコンテスト用</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-loader" aria-label="Loading" role="status"><div class="page-loader__inner"><span class="page-loader__spinner" aria-hidden="true"></span><span>TATSUMI TYPING</span></div></div>

  <!-- Language Switch Button (Goes to the English game) -->
  <div style="position: absolute; top: 15px; right: 15px; z-index: 1000;">
    <a href="english-game/index.html" style="padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-family: sans-serif; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">ENG</a>
  </div>

  <div id="game">
    <h1>辰巳中タイピング</h1>

    <div id="word-box">
      <div id="kanji">スタート</div>
      <div id="kana">すたーと</div>
      <div id="romaji-guide"></div>
    </div>

    <input
      type="text"
      id="input"
      placeholder="STARTを押してタイピング開始"
      autocomplete="off"
      disabled
    >

    <div id="status">
      <div id="score">スコア: 0</div>
      <div id="time">残り時間: 60</div>
    </div>

    <button id="start">START</button>

    <div id="game-over"></div>
  </div>

  <!-- 固定された効果音 (Removed "sounds/") -->
  <audio id="se-correct" src="correct.mp3" preload="auto"></audio>
  <audio id="se-miss" src="miss.mp3" preload="auto"></audio>
  <audio id="se-start" src="start.mp3" preload="auto"></audio>
  <audio id="se-end" src="end.mp3" preload="auto"></audio>

  <script>
  window.addEventListener("load", () => {
    const loader = document.querySelector(".page-loader");
    if (loader) window.setTimeout(() => loader.classList.add("is-hidden"), 180);
  });
</script>
  <script src="script.js"></script>
</body>
</html>
