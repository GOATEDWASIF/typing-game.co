<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>辰巳中タイピングコンテスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-loader" aria-label="読み込み中" role="status"><div class="page-loader__inner"><span class="page-loader__spinner" aria-hidden="true"></span><span>辰巳中タイピング</span></div></div>

  <div class="language-switch-wrap"><a class="points-board-link" href="points.html">ポイント管理 ↗</a></div>

  <div id="game">
    <h1>辰巳中タイピング</h1>

    <div class="contest-controls"><label for="contestant-name">参加者名</label><input id="contestant-name" type="text" maxlength="24" autocomplete="nickname" placeholder="名前を入力してください"><p class="contest-hint">名前を入力してから「開始」を押してください</p></div>

    <div id="word-box">
      <div id="kanji">スタート</div>
      <div id="kana">すたーと</div>
      <div id="romaji-guide"></div>
    </div>

    <input
      type="text"
      id="input"
      placeholder="「開始」を押してタイピング開始"
      autocomplete="off"
      disabled
    >

    <div id="status">
      <div id="score">スコア: 0</div>
      <div id="time">残り時間: 60</div>
    </div>

    <button id="start">開始</button>
    <button id="music-toggle" type="button" aria-pressed="false">♫ 音楽：オフ</button>

    <div id="game-over"></div>
    <section id="leaderboard" class="leaderboard" aria-live="polite"><h2>🏆 ランキング</h2><p class="leaderboard-status">スコア送信の準備ができています</p><ol id="leaderboard-list"><li>まだスコアがありません</li></ol></section>
  </div>

  <!-- 固定された効果音 (Removed "sounds/") -->
  <audio id="se-correct" src="correct.mp3" preload="auto"></audio>
  <audio id="se-miss" src="miss.mp3" preload="auto"></audio>
  <audio id="se-start" src="start.mp3" preload="auto"></audio>
  <audio id="se-end" src="end.mp3" preload="auto"></audio>

  <script>
  window.addEventListener("load", () => {
    const loader = document.querySelector(".page-loader");
    if (loader) window.setTimeout(() => loader.classList.add("is-hidden"), 180);
  });
</script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".language-switch").forEach(link => {
        link.addEventListener("click", event => {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          const destination = link.href;
          const game = document.getElementById("game");
          if (game) game.classList.add("is-transitioning");
          document.body.classList.add("page-leaving");
          window.setTimeout(() => { window.location.href = destination; }, 220);
        });
      });
    });
  </script>
  <script src="sheet-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
